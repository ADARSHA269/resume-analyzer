{% extends "base.html" %}
{% block title %}Edit patient record | CarePoint{% endblock %}
{% block content %}
<section class="page-heading"><div class="container"><span class="eyebrow">ADMIN PORTAL</span><h1 class="display-6 fw-bold mt-2">Edit patient record</h1><p class="text-secondary mb-0">Patient medical information is sensitive; access only as needed for care.</p></div></section>
<section class="container section-space pt-4"><div class="panel-card form-panel">
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label">Patient name</label><input class="form-control" name="name" value="{{ patient.name }}" required maxlength="100"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" value="{{ patient.email }}" required></div>
    <div class="col-md-4"><label class="form-label">Age</label><input class="form-control" name="age" type="number" min="0" max="120" value="{{ patient.age }}" required></div>
    <div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender" required>{% for value in ['Female', 'Male', 'Non-binary', 'Prefer not to say'] %}<option {% if value == patient.gender %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone }}" required maxlength="30"></div>
    <div class="col-12"><label class="form-label">Basic medical history</label><textarea class="form-control" name="medical_history" rows="4" maxlength="1000">{{ patient.medical_history }}</textarea></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Save patient record</button><a class="btn btn-outline-secondary" href="{{ url_for('manage_patients') }}">Cancel</a></div>
  </form>
</div></section>
{% endblock %}
